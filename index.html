<style>
  :root{
    --plum:#2B1B4D;
    --plum-deep:#1C1033;
    --gold:#F4B740;
    --coral:#FF6B5D;
    --cream:#FFF8ED;
    --green:#4CAF7D;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 20%, var(--plum) 0%, var(--plum-deep) 70%);
    font-family:'Poppins', sans-serif;
    color:var(--cream);
    padding:40px 20px;
    overflow-x:hidden;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    max-width:560px;
    width:100%;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 40px);
    margin:0;
    text-align:center;
    line-height:1.1;
  }

  .subtitle{
    text-align:center;
    color:#D9CFEE;
    font-size:17px;
    margin-top:-16px;
    max-width:380px;
  }

  .wheel-wrap{
    position:relative;
    width:min(460px, 92vw);
    height:min(460px, 92vw);
  }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:28px solid var(--gold);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    z-index:5;
  }

  .wheel-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), var(--coral), var(--gold));
    padding:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.45);
  }

  #wheelCanvas{
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--plum-deep);
    transition: transform 5.2s cubic-bezier(0.12, 0.85, 0.14, 1);
  }

  .hub{
    position:absolute;
    top:50%;
    left:50%;
    width:88px;
    height:88px;
    transform:translate(-50%, -50%);
    background:var(--plum-deep);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.5), 0 0 0 4px var(--gold);
    z-index:4;
    padding:16px;
  }
  .hub img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .spin-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:18px;
    color:var(--plum-deep);
    background:var(--gold);
    border:none;
    padding:16px 44px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(244,183,64,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }
  .spin-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 12px 26px rgba(244,183,64,0.45); }
  .spin-btn:active:not(:disabled){ transform:translateY(0); }
  .spin-btn:disabled{
    background:#5B4D7A;
    color:#B7ABD1;
    cursor:not-allowed;
    box-shadow:none;
    opacity:0.7;
  }

  .status{
    font-size:16px;
    font-weight:500;
    color:#E4DAF6;
    text-align:center;
    min-height:20px;
  }

  /* Modal de resultado */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(28,16,51,0.72);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
    z-index:20;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .modal{
    background:var(--cream);
    color:var(--plum-deep);
    border-radius:20px;
    padding:36px 32px;
    max-width:340px;
    width:90%;
    text-align:center;
    transform:scale(0.85);
    transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .overlay.show .modal{ transform:scale(1); }

  .modal .icon{ font-size:44px; margin-bottom:8px; }
  .modal h2{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    margin:0 0 6px;
  }
  .modal p{
    font-size:15px;
    color:#5A4E78;
    margin:0 0 22px;
  }
  .modal .prize-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:20px;
    color:var(--coral);
    display:block;
    margin-bottom:14px;
  }
  .instructions{
    font-size:14px;
    line-height:1.5;
    color:#5A4E78;
    background:#F3EEFA;
    border-radius:12px;
    padding:14px 16px;
    margin:0 0 22px;
    max-width:380px;
    text-align:center;
  }
  .instructions a{
    color:var(--plum-deep);
    font-weight:600;
    text-decoration:underline;
    word-break:break-word;
  }
  .modal button{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--plum-deep);
    color:var(--cream);
    border:none;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
  }

  /* Confeti */
  .confetti{
    position:fixed;
    top:-10px;
    width:8px;
    height:14px;
    opacity:0.9;
    z-index:19;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(540deg); opacity:0.4; }
  }

  @media (prefers-reduced-motion: reduce){
    #wheelCanvas{ transition-duration: 0.4s; }
    .confetti{ animation:none; display:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <span class="eyebrow">Gire e ganhe</span>
  <h1>Roleta de prêmios</h1>
  <p class="subtitle">Você tem apenas um giro. Todo mundo ganha algo!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel-ring">

  <button class="spin-btn" id="spinBtn" disabled>Girar a roleta</button>
  <p class="status" id="statusText"></p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="icon">🏆</div>
    <h2>Parabéns!</h2>
    <p>Você ganhou</p>
    <span class="prize-name" id="prizeName"></span>
    <p class="instructions" id="instructionsText"></p>
    <button id="closeModal">Entendi</button>
  </div>
</div>

<script>
/* =========================================================
   Los premios, el stock y la probabilidad ya NO se calculan aquí.
   Viven en el servidor (/api/spin.js + Vercel KV) porque el stock
   es compartido entre TODOS los visitantes: si "mentoria" tiene 5
   unidades, tiene que ser la misma cuenta de 5 para todo el mundo,
   no una por cada navegador. Esta página solo pide el resultado.
   ========================================================= */

  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const statusText = document.getElementById("statusText");
  const overlay = document.getElementById("overlay");
  const prizeNameEl = document.getElementById("prizeName");
  const instructionsEl = document.getElementById("instructionsText");
  const closeModalBtn = document.getElementById("closeModal");

  const size = canvas.width;
  const center = size / 2;
  const radius = size / 2;

  let PRIZES = [];      // se llena con la respuesta del servidor
  let sliceAngle = 0;

  function drawWheel(){
    ctx.clearRect(0, 0, size, size);
    PRIZES.forEach((prize, i) => {
      const start = i * sliceAngle - Math.PI / 2; // -90° para alinear con el puntero arriba
      const end = start + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = prize.color;
      ctx.fill();
      ctx.strokeStyle = "rgba(28,16,51,0.35)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Texto a lo largo del radio, con salto de línea para etiquetas largas
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + sliceAngle / 2);
      ctx.textAlign = "right";
      const fontSize = 21;
      ctx.font = "700 " + fontSize + "px Poppins, sans-serif";
      const textX = radius - 22;
      const maxLineWidth = 165;
      const lines = wrapLabel(ctx, prize.label, maxLineWidth);
      const lineHeight = fontSize + 4;
      const startY = -((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, li) => {
        const y = startY + li * lineHeight + 7;
        // Contorno claro para que el texto resalte sobre cualquier color de fondo
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(255,248,237,0.85)";
        ctx.lineJoin = "round";
        ctx.strokeText(line, textX, y);
        ctx.fillStyle = "#1C1033";
        ctx.fillText(line, textX, y);
      });
      ctx.restore();
    });
  }

  // Divide una etiqueta en varias líneas para que quepa dentro de un ancho máximo
  function wrapLabel(ctx, text, maxWidth){
    const words = text.split(" ");
    const lines = [];
    let current = "";
    words.forEach(word => {
      const test = current ? current + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function lockWheelAtIndex(index, animate){
    const sliceMid = index * sliceAngle + sliceAngle / 2;
    // Grados a rotar para que el gajo elegido quede bajo el puntero (arriba).
    const targetDeg = 360 - (sliceMid * 180 / Math.PI);
    const extraTurns = animate ? 6 : 0;
    const finalDeg = extraTurns * 360 + targetDeg;
    canvas.style.transition = animate ? "" : "none";
    canvas.style.transform = `rotate(${finalDeg}deg)`;
  }

  function renderInstructions(index){
    const prize = PRIZES[index];
    if (!prize) { instructionsEl.innerHTML = ""; return; }

    if (prize.instructions === 'link'){
      instructionsEl.innerHTML =
        'Acesse o material aqui: <a href="' + prize.link + '" target="_blank" rel="noopener">' + prize.link + '</a>';
    } else {
      instructionsEl.textContent = 'Dirija-se ao stand da afrus com este prêmio na tela para retirá-lo.';
    }
  }

  function showResultModal(label, index){
    prizeNameEl.textContent = label;
    renderInstructions(index);
    overlay.classList.add("show");
    launchConfetti();
  }

  function launchConfetti(){
    const colors = ["#F4B740", "#FF6B5D", "#4CAF7D", "#7A5FC4", "#3FB8C7"];
    for (let i = 0; i < 60; i++){
      const el = document.createElement("div");
      el.className = "confetti";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (2.5 + Math.random() * 1.5) + "s";
      el.style.animationDelay = (Math.random() * 0.4) + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }
  }

  function disableSpin(text){
    spinBtn.disabled = true;
    spinBtn.textContent = text || "Você já usou seu giro";
  }

  async function init(){
    statusText.textContent = "Carregando...";
    try {
      const res = await fetch('/api/spin', { method: 'GET' });
      const data = await res.json();

      PRIZES = data.prizes;
      sliceAngle = (2 * Math.PI) / PRIZES.length;
      drawWheel();

      if (data.played){
        // Esta persona (por cookie) ya giró antes: mostramos la ruleta
        // detenida en su premio real, confirmado por el servidor.
        lockWheelAtIndex(data.prizeIndex, false);
        disableSpin();
        statusText.textContent = "Seu prêmio: " + data.prizeLabel;
        renderInstructions(data.prizeIndex);
        instructionsEl.style.display = "block";
        document.querySelector(".stage").appendChild(instructionsEl);
      } else {
        statusText.textContent = "";
        spinBtn.disabled = false;
      }
    } catch(e){
      statusText.textContent = "Não foi possível carregar a roleta. Recarregue a página.";
    }
  }

  spinBtn.addEventListener("click", async () => {
    if (spinBtn.disabled) return;
    spinBtn.disabled = true;
    statusText.textContent = "Girando...";

    try {
      const res = await fetch('/api/spin', { method: 'POST' });
      const data = await res.json();

      if (data.soldOut){
        statusText.textContent = "Sinto muito, não há mais prêmios disponíveis no momento.";
        disableSpin("Prêmios esgotados");
        return;
      }

      PRIZES = data.prizes;
      lockWheelAtIndex(data.prizeIndex, true);

      canvas.addEventListener("transitionend", function onEnd(){
        canvas.removeEventListener("transitionend", onEnd);
        disableSpin();
        statusText.textContent = "Seu prêmio: " + data.prizeLabel;
        showResultModal(data.prizeLabel, data.prizeIndex);
      }, { once: true });
    } catch(e){
      statusText.textContent = "Erro ao girar. Tente novamente.";
      spinBtn.disabled = false;
    }
  });

  closeModalBtn.addEventListener("click", () => {
    overlay.classList.remove("show");
  });

  init();
</script>
</body>
</html>
